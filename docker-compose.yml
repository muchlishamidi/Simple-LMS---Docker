version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: lms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lmsdb}
      POSTGRES_USER: ${POSTGRES_USER:-lmsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lmspassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lmsuser} -d ${POSTGRES_DB:-lmsdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume: